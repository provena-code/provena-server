database_config:
  root_path: ./test_data/
  # Provena officially supports MySQL only (see CLAUDE.md).
  sqlalchemy_url: mysql://provena:CHANGE-ME@localhost/provena_CHANGE-ME
  echo: false
  optimize_codestate_ids: true
  indexed_columns:
  # Useful for the instructor view
  - AssignmentID
  # Also useful for getting event counts on a file
  - SubjectID
  - CodeStateSection
  - DestinationCodeStateSection
  # Useful for checking session syncing
  - SessionID
  # Used for subission checking (hash of code)
  - CodeStateID
  # Useful for browsing data
  - ServerTimestamp
  - ClientTimestamp

  metadata:
    Version: "1.0"
    IsEventOrderingConsistent: true
    EventOrderScope: Restricted
    EventOrderScopeColumns: SessionID
    CodeStateRepresentation: Table
    ProgramInputLinkTable: ""

add_server_timestamps: true

# Add API Keys here for testing purposes. Do not use in production.
testing_api_keys: []